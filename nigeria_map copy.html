<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nigeria Map </title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@400;600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --navy:#0d1b2e;
    --navy2:#12243c;
    --navy3:#1a3052;
    --accent:#3a7bd5;
    --gold:#f5a623;
    --light:#e8eef4;
    --text:#c9d8e8;
  }
  body{font-family:'Barlow',sans-serif;background:var(--navy);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden}
  
  /* HEADER */
  #header{background:var(--navy);border-bottom:2px solid var(--navy3);padding:0 16px;height:44px;display:flex;align-items:center;gap:16px;z-index:1000;flex-shrink:0}
  #header h1{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:18px;letter-spacing:2px;color:#fff;text-transform:uppercase;white-space:nowrap}
  #header h1 span{color:var(--accent)}
  .header-divider{width:1px;height:22px;background:var(--navy3)}

  /* TOOLBAR */
  #toolbar{background:var(--navy2);border-bottom:1px solid var(--navy3);padding:8px 12px;display:flex;align-items:center;gap:12px;z-index:999;flex-shrink:0;overflow-x:auto;white-space:nowrap}
  #toolbar .toolbar-label{font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;color:#8a9bb5;text-transform:uppercase;letter-spacing:1px;margin-right:4px;white-space:nowrap;flex-shrink:0}
  #cat-pills{display:flex;align-items:center;gap:8px;flex-wrap:nowrap;white-space:nowrap}
  .cat-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:99px;border:1.5px solid transparent;cursor:pointer;font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;letter-spacing:.5px;transition:all .15s;white-space:nowrap;background:transparent;color:#8a9bb5}
  .cat-pill .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .cat-pill.active{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff}
  .cat-pill:hover:not(.active){background:rgba(255,255,255,.05);color:#cdd}
  .toolbar-sep{width:1px;height:18px;background:var(--navy3);flex-shrink:0}
  
  /* MAP CONTAINER */
  #map-wrap{flex:1;position:relative;overflow:hidden}
  #map{width:100%;height:100%;background:#c8dce8}
  .leaflet-attribution-flag,.leaflet-control-attribution{display:none!important}
  .leaflet-control-zoom{margin:10px!important}
  .leaflet-control-zoom a{background:var(--navy2)!important;color:var(--text)!important;border-color:var(--navy3)!important;font-size:16px!important;line-height:24px!important;width:26px!important;height:26px!important}
  .leaflet-control-zoom a:hover{background:var(--navy3)!important}

  /* STATE TOOLTIP */
  .leaflet-tooltip{background:var(--navy)!important;border:1px solid var(--navy3)!important;color:var(--text)!important;font-family:'Barlow Condensed',sans-serif!important;font-size:10px!important;padding:2px 5px!important;white-space:nowrap;box-shadow:none!important}
  .leaflet-tooltip::before{display:none!important}

  /* STATE LABELS */
  .state-label{background:transparent!important;border:none!important;box-shadow:none!important;font-family:'Barlow Condensed',sans-serif!important;font-size:8px!important;font-weight:600!important;color:#5a4a2a!important;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;pointer-events:none!important}
  .state-label::before{display:none!important}

  /* INCIDENT TOOLTIP */
  .incident-tip{background:var(--navy)!important;border:1px solid var(--navy3)!important;color:#cdd!important;font-family:'Barlow',sans-serif!important;font-size:11px!important;padding:7px 10px!important;min-width:140px}
  .incident-tip .tip-cat{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:#fff;margin-bottom:2px}
  .incident-tip .tip-row{font-size:10px;color:#8a9bb5;margin-top:1px}

  /* CONTEXT MENU */
  #ctx-menu{position:fixed;background:var(--navy2);border:1px solid var(--navy3);border-radius:4px;z-index:9999;min-width:140px;box-shadow:0 4px 16px rgba(0,0,0,.5);display:none}
  #ctx-menu .ctx-item{padding:7px 14px;font-size:12px;font-family:'Barlow',sans-serif;cursor:pointer;color:var(--text);display:flex;align-items:center;gap:8px}
  #ctx-menu .ctx-item:hover{background:var(--navy3);color:#fff}
  #ctx-menu .ctx-item.danger{color:#e63946}
  #ctx-menu .ctx-item.danger:hover{background:#2a1015}
  #ctx-menu hr{border:none;border-top:1px solid var(--navy3);margin:2px 0}

  /* NOTE POPUP */
  #note-popup{position:fixed;background:var(--navy2);border:1px solid var(--navy3);border-radius:6px;z-index:9999;padding:12px;width:240px;box-shadow:0 6px 24px rgba(0,0,0,.6);display:none}
  #note-popup h4{font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:700;color:#fff;margin-bottom:8px}
  #note-popup textarea{width:100%;background:var(--navy);border:1px solid var(--navy3);color:var(--text);font-family:'Barlow',sans-serif;font-size:11px;border-radius:4px;padding:6px;resize:vertical;min-height:60px;outline:none}
  #note-popup textarea:focus{border-color:var(--accent)}
  #note-popup .popup-btns{display:flex;gap:6px;margin-top:8px;justify-content:flex-end}
  #note-popup button{padding:4px 12px;border:none;border-radius:3px;font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:600;cursor:pointer}
  #note-popup .btn-save{background:var(--accent);color:#fff}
  #note-popup .btn-cancel{background:var(--navy3);color:var(--text)}

  /* LEGEND BAR */
  #legend{background:var(--navy);border-top:2px solid var(--navy3);padding:0 12px;height:46px;display:flex;align-items:center;gap:0;z-index:1000;flex-shrink:0;overflow-x:auto;overflow-y:hidden}
  #legend::-webkit-scrollbar{height:3px}
  #legend::-webkit-scrollbar-track{background:var(--navy)}
  #legend::-webkit-scrollbar-thumb{background:var(--navy3);border-radius:2px}
  .legend-title{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1.5px;margin-right:10px;white-space:nowrap;flex-shrink:0}
  .legend-item{display:flex;align-items:center;gap:4px;padding:3px 7px;border-radius:3px;position:relative;cursor:pointer;white-space:nowrap;flex-shrink:0}
  .legend-item:hover{background:rgba(255,255,255,.05)}
  .legend-icon{width:14px;height:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;position:relative}
  .legend-icon input[type=color]{position:absolute;opacity:0;width:0;height:0}
  .legend-label{font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:600;color:#8a9bb5;text-transform:uppercase;letter-spacing:.8px;cursor:text;outline:none;min-width:10px}
  .legend-label:focus{color:#fff;border-bottom:1px dashed var(--accent)}
  .legend-delete{position:absolute;top:-5px;right:-3px;width:13px;height:13px;background:#e63946;border-radius:50%;display:none;align-items:center;justify-content:center;font-size:8px;color:#fff;cursor:pointer;z-index:2}
  .legend-item:hover .legend-delete{display:flex}
  .legend-item.locked .legend-delete{display:none!important}
  .legend-sep{width:1px;height:24px;background:var(--navy3);flex-shrink:0;margin:0 3px}
  #legend-add{padding:4px 8px;background:rgba(58,123,213,.2);border:1px solid rgba(58,123,213,.4);border-radius:3px;color:var(--accent);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;cursor:pointer;flex-shrink:0;margin-left:6px}
  #legend-add:hover{background:rgba(58,123,213,.35)}

  /* ENI logo in markers */
  .eni-marker-img{width:22px;height:auto;filter:drop-shadow(0 0 2px rgba(0,0,0,.3))}

  /* SIDE PANEL */
  #panel-toggle{position:absolute;right:0;top:50%;transform:translateY(-50%);z-index:900;background:var(--navy2);border:1px solid var(--navy3);border-right:none;border-radius:4px 0 0 4px;padding:8px 4px;cursor:pointer;writing-mode:vertical-rl;font-family:'Barlow Condensed',sans-serif;font-size:10px;font-weight:700;letter-spacing:1px;color:#8a9bb5;text-transform:uppercase;transition:all .2s}
  #panel-toggle:hover{color:#fff;background:var(--navy3)}
  #side-panel{position:absolute;right:-280px;top:0;bottom:0;width:280px;background:var(--navy2);border-left:1px solid var(--navy3);z-index:800;transition:right .25s;display:flex;flex-direction:column}
  #side-panel.open{right:0}
  .panel-head{padding:10px 12px;border-bottom:1px solid var(--navy3);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
  .panel-head h3{font-family:'Barlow Condensed',sans-serif;font-size:14px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:1px}
  .panel-filter{padding:8px;border-bottom:1px solid var(--navy3);flex-shrink:0}
  .panel-filter select{width:100%;background:var(--navy);border:1px solid var(--navy3);color:var(--text);font-family:'Barlow',sans-serif;font-size:11px;padding:4px 6px;border-radius:3px;outline:none}
  #incident-list{flex:1;overflow-y:auto;padding:4px 0}
  #incident-list::-webkit-scrollbar{width:4px}
  #incident-list::-webkit-scrollbar-track{background:var(--navy)}
  #incident-list::-webkit-scrollbar-thumb{background:var(--navy3)}
  .incident-row{padding:7px 10px;border-bottom:1px solid rgba(255,255,255,.04);cursor:pointer;display:flex;align-items:flex-start;gap:7px}
  .incident-row:hover{background:rgba(255,255,255,.04)}
  .incident-row .ir-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:3px}
  .incident-row .ir-info{flex:1;min-width:0}
  .incident-row .ir-cat{font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;color:#fff;text-transform:uppercase}
  .incident-row .ir-meta{font-size:10px;color:#6a7a8a;margin-top:1px}
  .incident-row .ir-note{font-size:10px;color:#8a9bb5;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .panel-footer{padding:8px;border-top:1px solid var(--navy3);flex-shrink:0}
  .panel-footer button{width:100%;padding:6px;background:rgba(58,123,213,.2);border:1px solid rgba(58,123,213,.4);border-radius:3px;color:var(--accent);font-family:'Barlow Condensed',sans-serif;font-size:12px;font-weight:700;cursor:pointer;text-transform:uppercase;letter-spacing:.5px}
  .panel-footer button:hover{background:rgba(58,123,213,.35)}

  /* COUNTRY LABELS */
  .country-label{background:transparent!important;border:none!important;box-shadow:none!important;font-family:'Barlow Condensed',sans-serif!important;font-size:11px!important;font-weight:600!important;color:#7a8fa0!important;text-transform:uppercase;letter-spacing:1.5px;pointer-events:none!important;white-space:nowrap}
  .country-label::before{display:none!important}
  .gulf-label{position:absolute;bottom:55px;left:40px;font-family:'Barlow Condensed',sans-serif;font-size:13px;font-weight:600;color:#6a8fa8;text-transform:uppercase;letter-spacing:2px;pointer-events:none;z-index:400;text-shadow:1px 1px 0 rgba(255,255,255,.2)}

  /* ICON PICKER DROPDOWN */
  .icon-picker-dropdown{position:absolute;bottom:40px;left:0;background:var(--navy2);border:1px solid var(--navy3);border-radius:4px;z-index:9999;padding:6px;display:none;grid-template-columns:repeat(4,28px);gap:4px;min-width:130px}
  .icon-picker-dropdown.open{display:grid}
  .icon-opt{width:28px;height:28px;display:flex;align-items:center;justify-content:center;cursor:pointer;border-radius:3px;font-size:13px}
  .icon-opt:hover{background:var(--navy3)}

  /* Highlighted marker */
  .highlighted-marker{filter:drop-shadow(0 0 6px gold)!important}
</style>
</head>
<body>

<!-- HEADER -->
<div id="header">
  <h1>NIGERIA <span>INCIDENT</span> MAP</h1>
  <div class="header-divider"></div>
  <span style="font-family:'Barlow Condensed',sans-serif;font-size:11px;font-weight:600;color:#8a9bb5;letter-spacing:.5px"></span>
</div>

<!-- TOOLBAR -->
<div id="toolbar">
  <span class="toolbar-label">Active Mode:</span>
  <div id="cat-pills"></div>
  <div class="toolbar-sep"></div>
  <span class="cat-pill" id="mode-none" onclick="setActiveMode(null)" style="border-color:#3a5060;color:#8a9bb5">✕ None</span>
</div>

<!-- MAP -->
<div id="map-wrap">
  <div id="map"></div>
  <div class="gulf-label">GULF OF GUINEA</div>
  <div id="panel-toggle" onclick="togglePanel()">INCIDENT LOG</div>
  <div id="side-panel">
    <div class="panel-head">
      <h3>Incident Log</h3>
      <span style="font-size:11px;color:#8a9bb5;cursor:pointer" onclick="togglePanel()">CLOSE ×</span>
    </div>
    <div class="panel-filter">
      <select id="panel-filter-select" onchange="renderIncidentList()">
        <option value="">All Categories</option>
      </select>
    </div>
    <div id="incident-list"></div>
    <div class="panel-footer">
      <button onclick="exportCSV()">⬇ Export CSV</button>
      <button onclick="exportSVG()" style="margin-top:6px;background:rgba(58,123,213,.2);border-color:rgba(58,123,213,.4);color:#3a7bd5">📄 Export SVG</button>
      <button onclick="clearAllIncidents()" style="margin-top:6px;background:rgba(230,57,70,.2);border-color:rgba(230,57,70,.4);color:#e63946">🗑 Clear All Incidents</button>
    </div>
  </div>
</div>

<!-- LEGEND BAR -->
<div id="legend">
  <span class="legend-title">Map Legend:</span>
  <div id="legend-items" style="display:flex;align-items:center;gap:0"></div>
  <div class="legend-sep"></div>
  <button id="legend-add" onclick="addCustomCategory()">+ Add</button>
</div>

<!-- CONTEXT MENU -->
<div id="ctx-menu">
  <div class="ctx-item" onclick="ctxEditNote()">✏ Edit Note</div>
  <div class="ctx-item" onclick="ctxChangeCategory()">⇄ Change Category</div>
  <hr>
  <div class="ctx-item danger" onclick="ctxDelete()">✕ Delete Marker</div>
</div>

<!-- NOTE POPUP -->
<div id="note-popup">
  <h4>Edit Note</h4>
  <textarea id="note-text" placeholder="Add a short description..."></textarea>
  <div class="popup-btns">
    <button class="btn-cancel" onclick="closeNotePopup()">Cancel</button>
    <button class="btn-save" onclick="saveNote()">Save</button>
  </div>
</div>

// ============================================================
// ICON HELPERS
// ============================================================
function makeSVGCircle(color){
  return `<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4.5" fill="${color}"/></svg>`;
}
function makeSVGCircleOutline(color){
  return `<svg width="10" height="10" viewBox="0 0 10 10"><circle cx="5" cy="5" r="4" fill="${color}" fill-opacity=".35" stroke="${color}" stroke-width="1.5"/></svg>`;
}
function makeSVGSquare(color){
  return `<svg width="10" height="10" viewBox="0 0 10 10"><rect x="1" y="1" width="8" height="8" fill="${color}"/></svg>`;
}
function makeSVGTriangle(color){
  return `<svg width="10" height="10" viewBox="0 0 10 10"><polygon points="5,1 9,9 1,9" fill="${color}"/></svg>`;
}
function makeSVGStar(color){
  return `<svg width="12" height="12" viewBox="0 0 12 12"><polygon points="6,1 7.5,4.5 11,4.5 8.5,7 9.5,11 6,9 2.5,11 3.5,7 1,4.5 4.5,4.5" fill="${color}"/></svg>`;
}
function makeSVGAnchor(color){
  return `<svg width="13" height="13" viewBox="0 0 13 13" fill="${color}"><circle cx="6.5" cy="2.5" r="1.5" fill="none" stroke="${color}" stroke-width="1.5"/><line x1="6.5" y1="4" x2="6.5" y2="11" stroke="${color}" stroke-width="1.5"/><path d="M3,7 C3,10 4.5,11 6.5,11 C8.5,11 10,10 10,7" stroke="${color}" stroke-width="1.5" fill="none"/><line x1="3" y1="5.5" x2="10" y2="5.5" stroke="${color}" stroke-width="1.5"/></svg>`;
}
function makeSVGPlane(color){
  return `<svg width="13" height="13" viewBox="0 0 13 13" fill="${color}"><path d="M6.5,1 L9,5.5 L12,6 L9,7 L10,11.5 L6.5,9.5 L3,11.5 L4,7 L1,6 L4,5.5 Z" fill="${color}"/></svg>`;
}
function makeSVGFlag(color){
  return `<svg width="12" height="12" viewBox="0 0 12 12"><line x1="2" y1="1" x2="2" y2="11" stroke="${color}" stroke-width="1.5"/><polygon points="2,1 10,3.5 2,6" fill="${color}"/></svg>`;
}
function makeIconSVG(iconType, color, size=10){
  if(iconType==='circle') return makeSVGCircle(color);
  if(iconType==='circle-outline') return makeSVGCircleOutline(color);
  if(iconType==='square') return makeSVGSquare(color);
  if(iconType==='triangle') return makeSVGTriangle(color);
  if(iconType==='star') return makeSVGStar(color);
  if(iconType==='anchor') return makeSVGAnchor(color);
  if(iconType==='plane') return makeSVGPlane(color);
  if(iconType==='flag') return makeSVGFlag(color);
  return makeSVGCircle(color);
}

// ============================================================
// LEAFLET ICON FACTORIES
// ============================================================
function makeDivIcon(cat, size=12){
  if(cat.icon==='eni'){
    return L.divIcon({
      html:`<img src="images/eni-logo.png" style="width:22px;height:auto;opacity:.9">`,
      iconSize:[22,16],iconAnchor:[11,8],
      className:'',popupAnchor:[0,-10]
    });
  }
  const svg = makeIconSVG(cat.icon, cat.color, size);
  return L.divIcon({
    html:`<div style="display:flex;align-items:center;justify-content:center">${svg}</div>`,
    iconSize:[14,14],iconAnchor:[7,7],
    className:'',popupAnchor:[0,-8]
  });
}

function makeInfraIcon(type, color){
  const svg = makeIconSVG(type, color);
  return L.divIcon({
    html:`<div style="display:flex;align-items:center;justify-content:center">${svg}</div>`,
    iconSize:[14,14],iconAnchor:[7,7],className:'',popupAnchor:[0,-8]
  });
}

function makeCityIcon(){
  return L.divIcon({
    html:`<svg width="6" height="6"><circle cx="3" cy="3" r="2.5" fill="none" stroke="#5a4a2a" stroke-width="1.2"/></svg>`,
    iconSize:[6,6],iconAnchor:[3,3],className:''

function loadNigeriaGeoJSON(){
  fetch('data/nigeria-states.geojson')
    .then(r=>r.json())
    .then(geojson=>{
      stateData = geojson;
      L.geoJSON(geojson,{
        style:{fillColor:'#f5e6c8',weight:1,color:'#8a7a60',fillOpacity:1},
        onEachFeature:(feature,layer)=>{
          const name = feature.properties.shapeName || feature.properties.NAME_1 || feature.properties.statename || 'State';
          layer.on('mouseover',function(){
            this.setStyle({fillColor:'#e8d4a8'});
            this.bindTooltip(name,{sticky:true,className:'leaflet-tooltip'}).openTooltip();
          });
          layer.on('mouseout',function(){
            this.setStyle({fillColor:'#f5e6c8'});
            this.closeTooltip();
          });
          // State label
          if(feature.geometry){
            try{
              const center = layer.getBounds().getCenter();
              const label = name==='Federal Capital Territory'?'F.C.T.':name;
              L.tooltip({permanent:true,direction:'center',className:'state-label',interactive:false})
                .setContent(`<span>${label}</span>`)
                .setLatLng(center)
                .addTo(map);
            }catch(e){}
          }
        }
      }).addTo(map);
      addENISites();
      addInfraMarkers();
      loadFromStorage();
    }).catch(err=>{
      console.error('GeoJSON load failed',err);
      // Still load markers even without states
      addENISites();
      addInfraMarkers();
      loadFromStorage();
    });
}

// Minimal TopoJSON converter
function convertTopo(topology, object){
  function decodeArcs(arcs, topology){
    return arcs.map(ring=>{
      let prevX=0, prevY=0;
      return ring.map(point=>{
        prevX += point[0]; prevY += point[1];
        return [
          prevX*topology.transform.scale[0] + topology.transform.translate[0],
          prevY*topology.transform.scale[1] + topology.transform.translate[1]
        ];
      });
    });
  }
  function getCoords(arc, topology){
    const idx = arc<0 ? ~arc : arc;
    const raw = decodeArcs([topology.arcs[idx]], topology)[0];
    return arc<0 ? raw.slice().reverse() : raw;
  }
  function ringToCoords(arcsRef, topology){
    return arcsRef.flatMap(a=>getCoords(a, topology).slice(0,-1)).concat([getCoords(arcsRef[0],topology)[0]]);
  }
  function convert(geom){
    if(geom.type==='Polygon'){
      return {type:'Polygon', coordinates: geom.arcs.map(r=>ringToCoords(r,topology).map(c=>[c[0],c[1]]))};
    } else if(geom.type==='MultiPolygon'){
      return {type:'MultiPolygon', coordinates: geom.arcs.map(poly=>poly.map(r=>ringToCoords(r,topology).map(c=>[c[0],c[1]])))};
    }
  }
  return {
    type:'FeatureCollection',
    features: object.geometries.map(g=>({
      type:'Feature',
      properties: g.properties||{},
      geometry: convert(g)
    }))
  };
}

function onMapClick(e){
  if(!activeMode) return;
  const cat = categories.find(c=>c.id===activeMode);
  if(!cat) return;
  const stateName = getStateName(e.latlng.lat, e.latlng.lng);
  const now = new Date();
  const incident = {
    id: Date.now(),
    catId: cat.id,
    lat: e.latlng.lat,
    lng: e.latlng.lng,
    state: stateName,
    timestamp: now.toISOString(),
    note:''
  };
  incidents.push(incident);
  const m = createIncidentMarker(incident);
  incident._marker = m;
  saveToStorage();
  renderIncidentList();
  updatePanelFilter();
}

function createIncidentMarker(incident){
  const cat = categories.find(c=>c.id===incident.catId)||categories[1];
  const icon = makeDivIcon(cat);
  const m = L.marker([incident.lat,incident.lng],{icon,draggable:true,zIndexOffset:100})
    .addTo(incidentLayerGroup);
  updateMarkerTooltip(m, incident);
  m.on('contextmenu', e=>{
    L.DomEvent.stopPropagation(e);
    showContextMenu(e.originalEvent.clientX, e.originalEvent.clientY, incident, m);
  });
  m.on('dragend', ()=>{
    const pos = m.getLatLng();
    incident.lat = pos.lat; incident.lng = pos.lng;
    incident.state = getStateName(pos.lat, pos.lng);
    updateMarkerTooltip(m, incident);
    saveToStorage(); renderIncidentList();
  });
  return m;
}

function updateMarkerTooltip(m, incident){
  const cat = categories.find(c=>c.id===incident.catId)||categories[1];
  const dt = new Date(incident.timestamp);
  const dtStr = dt.toLocaleDateString()+' '+dt.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});
  const html = `<div class="incident-tip">
    <div class="tip-cat" style="color:${cat.color}">${cat.name}</div>
    <div class="tip-row">📍 ${incident.state}</div>
    <div class="tip-row">🕐 ${dtStr}</div>
    ${incident.note?`<div class="tip-row" style="color:#aaa;margin-top:3px">${incident.note}</div>`:''}
  </div>`;
  m.unbindTooltip();
  m.bindTooltip(html,{className:'incident-tip',sticky:false,interactive:false,direction:'top',offset:[0,-8]});
}

function updateAllMarkersForCategory(catId){
  incidents.forEach(inc=>{
    if(inc.catId===catId && inc._marker){
      const cat = categories.find(c=>c.id===catId);
      if(cat) inc._marker.setIcon(makeDivIcon(cat));
      updateMarkerTooltip(inc._marker, inc);
    }
  });
}

// ============================================================
// STATE DETECTION
// ============================================================
function getStateName(lat, lng){
  if(!stateData) return 'Unknown';
  const pt = [lng, lat];
  for(const f of stateData.features){
    if(pointInFeature(pt, f)){
      return f.properties.shapeName || f.properties.NAME_1 || f.properties.statename || 'Unknown';
    }
  }
  return 'Unknown';
}
function pointInFeature(pt, feature){
  const g = feature.geometry;
  if(g.type==='Polygon') return pointInPolygon(pt, g.coordinates);
  if(g.type==='MultiPolygon') return g.coordinates.some(poly=>pointInPolygon(pt,poly));
  return false;
}
function pointInPolygon(pt, rings){
  const ring = rings[0];
  let inside = false;
  for(let i=0,j=ring.length-1;i<ring.length;j=i++){
    const xi=ring[i][0],yi=ring[i][1],xj=ring[j][0],yj=ring[j][1];
    if(((yi>pt[1])!==(yj>pt[1]))&&(pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi)) inside=!inside;
  }
  return inside;
}

function renderLegend(){
  const container = document.getElementById('legend-items');
  container.innerHTML='';
  categories.forEach((cat,idx)=>{
    const item = document.createElement('div');
    item.className='legend-item'+(cat.locked?' locked':'');
    item.dataset.catid=cat.id;

    // Icon / color swatch
    const iconWrap = document.createElement('div');
    iconWrap.className='legend-icon';
    if(cat.id==='eni'){
      iconWrap.innerHTML=`<img src="images/eni-logo.png" style="width:28px;height:auto">`;
    } else {
      const colorInput = document.createElement('input');
      colorInput.type='color'; colorInput.value=cat.color;
      colorInput.addEventListener('input',e=>{
        cat.color=e.target.value;
        renderLegend(); renderToolbar();
        updateAllMarkersForCategory(cat.id);
        saveToStorage();
      });
      const svgEl = document.createElement('span');
      svgEl.innerHTML=makeIconSVG(cat.icon, cat.color, 12);
      svgEl.style.cursor='pointer';
      svgEl.title='Click to change color';
      svgEl.onclick=()=>colorInput.click();
      iconWrap.appendChild(svgEl);
      iconWrap.appendChild(colorInput);
    }
    item.appendChild(iconWrap);

    // Label
    const label = document.createElement('span');
    label.className='legend-label';
    label.contentEditable = cat.locked ? 'false' : 'true';
    label.textContent=cat.name;
    label.onblur=()=>{
      cat.name=label.textContent.trim()||cat.name;
      renderToolbar(); saveToStorage(); updatePanelFilter();
    };
    label.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();label.blur();}};
    item.appendChild(label);

    // Icon picker button (not for locked ENI/capital)
    if(!cat.locked || cat.id==='capital'){
      const pickBtn = document.createElement('span');
      pickBtn.textContent='✏'; pickBtn.title='Change icon';
      pickBtn.style.cssText='font-size:8px;color:#4a6080;cursor:pointer;margin-left:2px';
      const dropdown = document.createElement('div');
      dropdown.className='icon-picker-dropdown';
      const icons = ['circle','circle-outline','square','triangle','star','flag','anchor','plane'];
      icons.forEach(ic=>{
        const opt = document.createElement('div');
        opt.className='icon-opt';
        opt.innerHTML=makeIconSVG(ic,cat.color,12);
        opt.title=ic;
        opt.onclick=()=>{
          cat.icon=ic; dropdown.classList.remove('open');
          renderLegend(); renderToolbar();
          updateAllMarkersForCategory(cat.id);
          saveToStorage();
        };
        dropdown.appendChild(opt);
      });
      pickBtn.onclick=e=>{e.stopPropagation();dropdown.classList.toggle('open');};
      document.addEventListener('click',()=>dropdown.classList.remove('open'));
      item.appendChild(pickBtn);
      item.appendChild(dropdown);
    }

    // Delete button
    if(!cat.locked){
      const del = document.createElement('div');
      del.className='legend-delete'; del.textContent='×'; del.title='Delete category';
      del.onclick=e=>{
        e.stopPropagation();
        if(confirm(`Delete category "${cat.name}"?`)){
          categories.splice(idx,1);
          incidents.filter(inc=>inc.catId===cat.id).forEach(inc=>{
            if(inc._marker) incidentLayerGroup.removeLayer(inc._marker);
          });
          incidents=incidents.filter(inc=>inc.catId!==cat.id);
          renderLegend(); renderToolbar(); renderIncidentList(); saveToStorage();
        }
      };
      item.appendChild(del);
    }

    container.appendChild(item);
    // Separator between items
    const sep = document.createElement('div');
    sep.className='legend-sep';
    container.appendChild(sep);
  });
}

function renderIncidentList(){

    list.innerHTML='<div style="padding:14px;font-size:11px;color:#4a6080;text-align:center">No incidents logged</div>';

    const row = document.createElement('div');

function exportCSV(){
  const header='ID,Category,State,Latitude,Longitude,Timestamp,Note\n';
  const rows = incidents.map(i=>{
    const cat = categories.find(c=>c.id===i.catId)||{name:i.catId};
    return `${i.id},"${cat.name}","${i.state}",${i.lat.toFixed(5)},${i.lng.toFixed(5)},"${i.timestamp}","${(i.note||'').replace(/"/g,'""')}"`;
  }).join('\n');
  const blob = new Blob([header+rows],{type:'text/csv'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='nigeria_incidents.csv';
  a.click(); URL.revokeObjectURL(url);
}

function exportSVG(){
  // Get current map bounds
  const bounds = map.getBounds();
  const size = map.getSize();
  
  // Create SVG container
  const svgNS = "http://www.w3.org/2000/svg";
  const svg = document.createElementNS(svgNS, "svg");
  svg.setAttribute("width", size.x);
  svg.setAttribute("height", size.y);
  svg.setAttribute("viewBox", `0 0 ${size.x} ${size.y}`);
  svg.setAttribute("xmlns", svgNS);
  
  // Add background
  const bg = document.createElementNS(svgNS, "rect");
  bg.setAttribute("width", size.x);
  bg.setAttribute("height", size.y);
  bg.setAttribute("fill", "#c8dce8");
  svg.appendChild(bg);
  
  // Add state boundaries and labels
  if(stateData && stateData.features){
    stateData.features.forEach(feature => {
      const coords = feature.geometry.coordinates;
      const name = feature.properties.shapeName || 'Unknown';
      const displayName = name === 'Abuja Federal Capital Territory' ? 'F.C.T.' : name;
      
      const path = document.createElementNS(svgNS, "path");
      let pathData = "";
      
      const processCoords = (coordArray) => {
        coordArray.forEach(ring => {
          ring.forEach((coord, i) => {
            const point = map.latLngToContainerPoint([coord[1], coord[0]]);
            if(i === 0){
              pathData += `M ${point.x} ${point.y}`;
            } else {
              pathData += ` L ${point.x} ${point.y}`;
            }
          });
          pathData += " Z";
        });
      };
      
      if(feature.geometry.type === 'Polygon'){
        processCoords(coords);
      } else if(feature.geometry.type === 'MultiPolygon'){
        coords.forEach(polygon => processCoords(polygon));
      }
      
      path.setAttribute("d", pathData);
      path.setAttribute("fill", "#f5e6c8");
      path.setAttribute("stroke", "#8a7a60");
      path.setAttribute("stroke-width", "1");
      svg.appendChild(path);
      
      // Add state label
      try {
        const center = map.latLngToContainerPoint(L.geoJSON(feature).getBounds().getCenter());
        const text = document.createElementNS(svgNS, "text");
        text.setAttribute("x", center.x);
        text.setAttribute("y", center.y);
        text.setAttribute("text-anchor", "middle");
        text.setAttribute("dominant-baseline", "middle");
        text.setAttribute("font-family", "Barlow Condensed, sans-serif");
        text.setAttribute("font-size", "8");
        text.setAttribute("font-weight", "600");
        text.setAttribute("fill", "#5a4a2a");
        text.setAttribute("text-transform", "uppercase");
        text.textContent = displayName;
        svg.appendChild(text);
      } catch(e) {}
    });
  }
  
  // Add incident markers
  incidents.forEach(incident => {
    const cat = categories.find(c => c.id === incident.catId);
    if(!cat) return;
    
    const point = map.latLngToContainerPoint([incident.lat, incident.lng]);
    const circle = document.createElementNS(svgNS, "circle");
    circle.setAttribute("cx", point.x);
    circle.setAttribute("cy", point.y);
    circle.setAttribute("r", "6");
    circle.setAttribute("fill", cat.color);
    circle.setAttribute("stroke", "#fff");
    circle.setAttribute("stroke-width", "1");
    svg.appendChild(circle);
  });
  
  // Add ENI sites with text label
  ENI_SITES.forEach(site => {
    const point = map.latLngToContainerPoint([site.lat, site.lng]);
    
    // Add ENI text as icon replacement
    const text = document.createElementNS(svgNS, "text");
    text.setAttribute("x", point.x);
    text.setAttribute("y", point.y);
    text.setAttribute("text-anchor", "middle");
    text.setAttribute("dominant-baseline", "middle");
    text.setAttribute("font-family", "Arial, sans-serif");
    text.setAttribute("font-size", "10");
    text.setAttribute("font-weight", "bold");
    text.setAttribute("fill", "#f5a623");
    text.textContent = "ENI";
    svg.appendChild(text);
    
    // Add small background rectangle
    const bbox = text.getBBox ? text.getBBox() : { width: 20, height: 8 };
    const rect = document.createElementNS(svgNS, "rect");
    rect.setAttribute("x", point.x - bbox.width/2 - 2);
    rect.setAttribute("y", point.y - bbox.height/2 - 1);
    rect.setAttribute("width", bbox.width + 4);
    rect.setAttribute("height", bbox.height + 2);
    rect.setAttribute("fill", "#fff");
    rect.setAttribute("stroke", "#f5a623");
    rect.setAttribute("stroke-width", "1");
    rect.setAttribute("rx", "2");
    svg.insertBefore(rect, text);
  });
  
  // Add legend at bottom with padding
  const legendHeight = 50;
  const legendY = size.y - legendHeight - 10;
  let legendX = 20;
  
  // Legend background
  const legendBg = document.createElementNS(svgNS, "rect");
  legendBg.setAttribute("x", 10);
  legendBg.setAttribute("y", legendY - 10);
  legendBg.setAttribute("width", size.x - 20);
  legendBg.setAttribute("height", 45);
  legendBg.setAttribute("fill", "#0d1b2e");
  legendBg.setAttribute("stroke", "#1a3052");
  legendBg.setAttribute("stroke-width", "2");
  svg.appendChild(legendBg);
  
  // Legend title
  const legendTitle = document.createElementNS(svgNS, "text");
  legendTitle.setAttribute("x", legendX);
  legendTitle.setAttribute("y", legendY + 15);
  legendTitle.setAttribute("font-family", "Barlow Condensed, sans-serif");
  legendTitle.setAttribute("font-size", "12");
  legendTitle.setAttribute("font-weight", "700");
  legendTitle.setAttribute("fill", "#fff");
  legendTitle.setAttribute("text-transform", "uppercase");
  legendTitle.setAttribute("letter-spacing", "1.5px");
  legendTitle.textContent = "Map Legend:";
  svg.appendChild(legendTitle);
  
  legendX += 100;
  
  // Legend items
  categories.forEach(cat => {
    // Icon/color swatch
    if(cat.id === 'eni'){
      // ENI text
      const eniText = document.createElementNS(svgNS, "text");
      eniText.setAttribute("x", legendX);
      eniText.setAttribute("y", legendY + 15);
      eniText.setAttribute("font-family", "Arial, sans-serif");
      eniText.setAttribute("font-size", "10");
      eniText.setAttribute("font-weight", "bold");
      eniText.setAttribute("fill", "#f5a623");
      eniText.textContent = "ENI";
      svg.appendChild(eniText);
      
      // White background for ENI
      const eniBg = document.createElementNS(svgNS, "rect");
      eniBg.setAttribute("x", legendX - 8);
      eniBg.setAttribute("y", legendY + 7);
      eniBg.setAttribute("width", 16);
      eniBg.setAttribute("height", 12);
      eniBg.setAttribute("fill", "#fff");
      eniBg.setAttribute("stroke", "#f5a623");
      eniBg.setAttribute("stroke-width", "1");
      eniBg.setAttribute("rx", "2");
      svg.insertBefore(eniBg, eniText);
      
      legendX += 35;
    } else {
      // Color circle
      const circle = document.createElementNS(svgNS, "circle");
      circle.setAttribute("cx", legendX + 7);
      circle.setAttribute("cy", legendY + 13);
      circle.setAttribute("r", "5");
      circle.setAttribute("fill", cat.color);
      svg.appendChild(circle);
      
      legendX += 20;
    }
    
    // Category name
    const label = document.createElementNS(svgNS, "text");
    label.setAttribute("x", legendX);
    label.setAttribute("y", legendY + 15);
    label.setAttribute("font-family", "Barlow Condensed, sans-serif");
    label.setAttribute("font-size", "10");
    label.setAttribute("font-weight", "600");
    label.setAttribute("fill", "#8a9bb5");
    label.setAttribute("text-transform", "uppercase");
    label.setAttribute("letter-spacing", "0.8px");
    label.textContent = cat.name;
    svg.appendChild(label);
    
    legendX += cat.name.length * 6 + 25;
    
    // Add separator
    const sep = document.createElementNS(svgNS, "rect");
    sep.setAttribute("x", legendX - 10);
    sep.setAttribute("y", legendY + 5);
    sep.setAttribute("width", "1");
    sep.setAttribute("height", "20");
    sep.setAttribute("fill", "#1a3052");
    svg.appendChild(sep);
    
    legendX += 15;
  });
  
  // Serialize and download
  const svgData = new XMLSerializer().serializeToString(svg);
  const blob = new Blob([svgData], {type: 'image/svg+xml'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'nigeria_map.svg';
  a.click();
  URL.revokeObjectURL(url);
}

function clearAllIncidents(){
  if(incidents.length === 0){
    alert('No incidents to clear');
    return;
  }
  if(confirm(`Remove all ${incidents.length} incident markers from the map? This cannot be undone.`)){
    // Remove all incident markers from map
    incidents.forEach(inc => {
      if(inc._marker){
        incidentLayerGroup.removeLayer(inc._marker);
      }
    });
    // Clear incidents array
    incidents = [];
    // Save to storage
    saveToStorage();
    // Update UI
    renderIncidentList();
    updatePanelFilter();
  }
}

// ============================================================
// LOCAL STORAGE
// ============================================================
function saveToStorage(){
  const data = {
    categories: categories.map(c=>({id:c.id,name:c.name,color:c.color,icon:c.icon,locked:c.locked})),
    incidents: incidents.map(i=>({id:i.id,catId:i.catId,lat:i.lat,lng:i.lng,state:i.state,timestamp:i.timestamp,note:i.note}))
  };
  try{localStorage.setItem('nigeria_map_v2', JSON.stringify(data));}catch(e){}
}

function loadFromStorage(){
  try{
    const raw = localStorage.getItem('nigeria_map_v2');
    if(!raw) return;
    const data = JSON.parse(raw);
    if(data.categories && data.categories.length){
      // Merge: update existing, add new custom
      data.categories.forEach(saved=>{
        const existing = categories.find(c=>c.id===saved.id);
        if(existing){
          existing.name=saved.name;
          if(!existing.locked) existing.color=saved.color;
          existing.icon=saved.icon;
        } else {
          categories.push(saved);
        }
      });
    }
    if(data.incidents){
      incidents=[];
      data.incidents.forEach(inc=>{
        const m = createIncidentMarker(inc);
        incidents.push({...inc,_marker:m});
      });
    }
    renderLegend(); renderToolbar(); renderIncidentList(); updatePanelFilter();
  }catch(e){console.warn('Storage load failed',e);}
}

// ============================================================
// BOOT
// ============================================================
document.addEventListener('DOMContentLoaded', ()=>{
  renderLegend();
  renderToolbar();
  updatePanelFilter();
  initMap();
  // Default mode-none highlighted
  document.getElementById('mode-none').classList.add('active');
});
</script>
